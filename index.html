                              ยังไม่มีข้อความติดต่อเข้ามาในขณะนี้
                            </p>
                          ) : (
                            <div className="space-y-4">
                              {messages.map((m) => (
                                <div
                                  key={m.id}
                                  className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex flex-col sm:flex-row justify-between gap-4"
                                >
                                  <div>
                                    <div className="font-bold text-[#091947]">{m.subject}</div>
                                    <div className="text-xs text-slate-500 mt-0.5">
                                      จาก: {m.sender_name} • โทร: {m.sender_phone || '-'} • อีเมล:{' '}
                                      {m.sender_email || '-'} ({m.created_at})
                                    </div>
                                    <p className="text-sm text-slate-700 mt-2">{m.message}</p>
                                  </div>
                                  <button
                                    onClick={() => {
                                      setMessages(messages.filter((x) => x.id !== m.id));
                                      notify('ลบข้อความเรียบร้อยแล้ว');
                                    }}
                                    className="self-start text-red-600 hover:bg-red-50 px-3 py-1 rounded-lg text-xs font-bold"
                                  >
                                    ลบ
                                  </button>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}

                      {adminTab === 'database' && (
                        <div className="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
                          <div>
                            <h3 className="text-lg font-bold text-[#091947]">
                              สถานะการเชื่อมต่อฐานข้อมูล Supabase
                            </h3>
                            <p className="text-sm text-slate-600 mt-1">
                              ระบบเชื่อมต่อกับฐานข้อมูลหลักของสโมสรเรียบร้อยแล้ว
                            </p>
                          </div>

                          <div className="grid sm:grid-cols-2 gap-4">
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Supabase Project URL
                              </label>
                              <input
                                type="url"
                                value={sbConfig.url}
                                onChange={(e) => setSbConfig({ ...sbConfig, url: e.target.value })}
                                className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                              />
                            </div>
                            <div>
                              <label className="block text-xs font-bold text-slate-700 mb-1">
                                Supabase Anon Public Key
                              </label>
                              <input
                                type="text"
                                value={sbConfig.anonKey}
                                onChange={(e) => setSbConfig({ ...sbConfig, anonKey: e.target.value })}
                                className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                              />
                            </div>
                          </div>

                          <div className="flex flex-wrap gap-3">
                            <button
                              onClick={() => {
                                localStorage.setItem(
                                  'lions_taladkhet_supabase_cfg',
                                  JSON.stringify(sbConfig)
                                );
                                notify('บันทึกการตั้งค่าฐานข้อมูลแล้ว กำลังรีเฟรชหน้าเว็บ...');
                                setTimeout(() => window.location.reload(), 1000);
                              }}
                              className="bg-[#091947] hover:bg-[#0F296E] text-amber-300 font-bold px-5 py-2.5 rounded-lg text-sm"
                            >
                              บันทึกและเชื่อมต่อฐานข้อมูลจริง
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="bg-[#061133] text-slate-300 border-t-4 border-amber-500 mt-12">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                <div className="grid md:grid-cols-3 gap-8 pb-8 border-b border-blue-900/60">
                  <div className="space-y-3">
                    <div className="flex items-center gap-3">
                      <LionsOfficialEmblem size={48} />
                      <div>
                        <div className="font-bold text-white text-base">{t.clubName}</div>
                        <div className="text-xs text-amber-400">Lions Clubs International • 310 D</div>
                      </div>
                    </div>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      {lang === 'th'
                        ? 'องค์กรสาธารณประโยชน์สากล มุ่งมั่นบำเพ็ญประโยชน์เพื่อสังคมและชุมชนในพื้นที่ตำบลตลาดเขต อำเภอพนมทวน จังหวัดกาญจนบุรี ภายใต้อุดมการณ์ "เราให้บริการ (We Serve)"'
                        : 'An international humanitarian service organization serving Taladkhet, Phanom Thuan District, Kanchanaburi Province under the global motto "We Serve".'}
                    </p>
                    <div className="flex flex-wrap gap-2 pt-2">
                      <a
                        href="https://maps.app.goo.gl/wi6p3zCUTVpeYbaD7?g_st=al"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-[#091947] text-xs font-bold rounded-lg shadow transition-all"
                      >
                        <span>📍</span>
                        <span>{lang === 'th' ? 'นำทางไปที่ตั้งสโมสร (Google Maps)' : 'Navigate to Club Location'}</span>
                      </a>
                    </div>
                  </div>

                  <div>
                    <h4 className="text-sm font-bold text-amber-400 uppercase tracking-wider mb-3">
                      {lang === 'th' ? 'เมนูหลักเว็บไซต์' : 'Quick Navigation'}
                    </h4>
                    <div className="grid grid-cols-2 gap-2 text-xs">
                      {navItems.map((item) => (
                        <button
                          key={item.id}
                          onClick={() => navigateTo(item.id)}
                          className="text-left hover:text-amber-300 transition"
                        >
                          - {item.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <h4 className="text-sm font-bold text-amber-400 uppercase tracking-wider mb-3">
                      {lang === 'th' ? 'พื้นที่ให้บริการ' : 'Service Area'}
                    </h4>
                    <p className="text-xs text-slate-400 leading-relaxed">
                      {lang === 'th'
                        ? 'ตำบลตลาดเขต อำเภอพนมทวน จังหวัดกาญจนบุรี • สโมสรไลออนส์สากล ภาค 310 D'
                        : 'Taladkhet, Phanom Thuan District, Kanchanaburi • Lions Clubs International District 310 D'}
                    </p>
                  </div>
                </div>

                <div className="pt-6 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-400">
                  <div>
                    © 2026 สโมสรไลออนส์ตลาดเขต จังหวัดกาญจนบุรี (Lions Club of Taladkhet Kanchanaburi). All Rights Reserved.
                  </div>
                  <div className="text-amber-400/90 font-semibold">WE SERVE • เราให้บริการ</div>
                </div>
              </div>
            </footer>

        );
      }

      // ======================================================================
      // DONATION MODAL COMPONENT (ร่วมบริจาค + ขอใบลดหย่อนภาษี)
      // ======================================================================
      function DonationModal({ lang, onClose, notify, onNewDonation }) {
        const [projectName, setProjectName] = useState('กองทุนสาธารณกุศลทั่วไป');
        const [amount, setAmount] = useState('500');
        const [donorName, setDonorName] = useState('');
        const [donorPhone, setDonorPhone] = useState('');
        const [donorEmail, setDonorEmail] = useState('');
        const [needTaxReceipt, setNeedTaxReceipt] = useState(false);
        const [taxId, setTaxId] = useState('');
        const [taxAddress, setTaxAddress] = useState('');
        const [slipFile, setSlipFile] = useState(null);
        const [slipPreview, setSlipPreview] = useState('');
        const [submitting, setSubmitting] = useState(false);

        const quickAmounts = ['100', '300', '500', '1000', '5000'];

        const handleFileChange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setSlipFile(file);
          const reader = new FileReader();
          reader.onload = () => setSlipPreview(reader.result);
          reader.readAsDataURL(file);
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!amount || Number(amount) <= 0) {
            notify(lang === 'th' ? 'กรุณาระบุจำนวนเงินบริจาค' : 'Please enter donation amount', 'error');
            return;
          }
          if (needTaxReceipt && (!taxId || !donorEmail)) {
            notify(
              lang === 'th'
                ? 'กรุณากรอกเลขประจำตัวผู้เสียภาษีและอีเมลสำหรับรับใบเสร็จ'
                : 'Please provide Tax ID and Email for tax receipt',
              'error'
            );
            return;
          }

          setSubmitting(true);
          let uploadedSlipUrl = slipPreview;

          try {
            if (isSupabaseConfigured && supabaseClient && slipFile) {
              const fileExt = slipFile.name.split('.').pop();
              const fileName = `slip-${Date.now()}.${fileExt}`;
              const { error: uploadErr } = await supabaseClient.storage
                .from('donation_slips')
                .upload(fileName, slipFile);

              if (!uploadErr) {
                const { data } = supabaseClient.storage
                  .from('donation_slips')
                  .getPublicUrl(fileName);
                uploadedSlipUrl = data.publicUrl;
              }
            }

            const payload = {
              donor_name: donorName.trim() || 'ผู้ไม่ประสงค์ออกนาม',
              donor_phone: donorPhone.trim(),
              donor_email: donorEmail.trim(),
              amount: Number(amount),
              project_name: projectName,
              need_tax_receipt: needTaxReceipt,
              tax_id: needTaxReceipt ? taxId.trim() : '',
              tax_address: needTaxReceipt ? taxAddress.trim() : '',
              slip_url: uploadedSlipUrl,
              status: 'pending'
            };

            let savedRecord = {
              id: `don-${Date.now()}`,
              created_at: new Date().toISOString(),
              ...payload
            };

            if (isSupabaseConfigured && supabaseClient) {
              const { error: insertErr } = await supabaseClient
                .from('donations')
                .insert([payload]);
              if (insertErr) {
                console.warn('Supabase insert note:', insertErr.message);
              }
            }

            onNewDonation(savedRecord);
            notify(
              lang === 'th'
                ? 'ส่งข้อมูลการบริจาคเรียบร้อยแล้ว ขอบพระคุณในจิตอันเป็นกุศลครับ'
                : 'Thank you! Your donation details have been submitted.'
            );
            onClose();
          } catch (err) {
            console.error(err);
            notify(lang === 'th' ? 'เกิดข้อผิดพลาด กรุณาลองใหม่' : 'Submission error', 'error');
          } finally {
            setSubmitting(false);
          }
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4 overflow-y-auto">
            <div className="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border-2 border-amber-400 overflow-hidden my-8">
              <div className="bg-gradient-to-r from-[#091947] to-[#0F296E] text-white px-6 py-4 flex items-center justify-between border-b-4 border-amber-500">
                <div className="flex items-center gap-3">
                  <LionsOfficialEmblem size={42} />
                  <div>
                    <h3 className="font-serif-thai text-lg font-bold text-amber-300">
                      {lang === 'th' ? 'ร่วมบริจาคสมทบทุนสาธารณประโยชน์' : 'Support Our Humanitarian Service'}
                    </h3>
                    <p className="text-xs text-slate-300">สโมสรไลออนส์ตลาดเขต • Lions Club of Taladkhet</p>
                  </div>
                </div>
                <button
                  onClick={onClose}
                  className="text-slate-300 hover:text-white text-xl font-bold px-2"
                >
                  ✕
                </button>
              </div>

              <form onSubmit={handleSubmit} className="p-6 space-y-5 max-h-[82vh] overflow-y-auto">
                {/* 1. เลือกโครงการและยอดเงิน */}
                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {lang === 'th' ? 'โครงการที่ต้องการสนับสนุน' : 'Select Service Fund'}
                    </label>
                    <select
                      value={projectName}
                      onChange={(e) => setProjectName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm bg-white"
                    >
                      <option value="กองทุนสาธารณกุศลทั่วไป">กองทุนสาธารณกุศลทั่วไป (General Fund)</option>
                      <option value="โครงการตรวจวัดสายตาและมอบแว่นตา">โครงการด้านสายตาและมอบแว่นตา (Vision)</option>
                      <option value="กองทุนทุนการศึกษาเยาวชนตลาดเขต">กองทุนทุนการศึกษาเยาวชน (Youth)</option>
                      <option value="กองทุนบรรเทาภัยพิบัติและถุงยังชีพ">กองทุนบรรเทาภัยพิบัติ (Relief)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {lang === 'th' ? 'จำนวนเงินบริจาค (บาท) *' : 'Donation Amount (THB) *'}
                    </label>
                    <input
                      type="number"
                      min="1"
                      required
                      value={amount}
                      onChange={(e) => setAmount(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm font-bold text-[#091947]"
                    />
                  </div>
                </div>

                {/* ปุ่มเลือกยอดด่วน */}
                <div className="flex flex-wrap gap-2">
                  {quickAmounts.map((val) => (
                    <button
                      type="button"
                      key={val}
                      onClick={() => setAmount(val)}
                      className={`px-3.5 py-1.5 rounded-lg text-xs font-bold border transition ${
                        amount === val
                          ? 'bg-[#091947] text-amber-300 border-[#091947]'
                          : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-amber-50'
                      }`}
                    >
                      ฿{Number(val).toLocaleString()}
                    </button>
                  ))}
                </div>

                {/* 2. ช่องทางโอนเงินตัวอย่าง + QR Code */}
                <div className="bg-blue-50/80 border border-blue-200 rounded-xl p-4 grid sm:grid-cols-12 gap-4 items-center">
                  <div className="sm:col-span-4 flex flex-col items-center justify-center bg-white p-3 rounded-xl border border-slate-200">
                 <img
                      src="/qr-donate.png"
                      alt="QR Code ร่วมบริจาคสโมสรไลออนส์ตลาดเขต"
                      className="w-32 h-32 object-contain"
                    />
                    <span className="text-[10px] font-bold text-blue-900 mt-1.5">
                      สแกน QR Code เพื่อร่วมบริจาค
                    </span>
                  </div>

                  <div className="sm:col-span-8 space-y-1.5 text-xs">
                    <div className="inline-block px-2 py-0.5 rounded bg-amber-200 text-amber-900 font-bold text-[11px]">
                      ช่องทางโอนเงินบริจาค 
                    </div>
                    <div className="font-bold text-[#091947] text-sm">
                      {lang === 'th' ? CLUB_DONATION_ACCOUNT.bankNameTh : CLUB_DONATION_ACCOUNT.bankNameEn}
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="font-mono text-base font-bold text-blue-900">
                        {CLUB_DONATION_ACCOUNT.accountNumber}
                      </span>
                      <button
                        type="button"
                        onClick={() => {
                          navigator.clipboard.writeText(CLUB_DONATION_ACCOUNT.accountNumber);
                          notify('คัดลอกเลขบัญชีแล้ว');
                        }}
                        className="px-2 py-0.5 bg-white border border-slate-300 rounded text-[11px] font-semibold hover:bg-slate-100"
                      >
                        คัดลอก
                      </button>
                    </div>
                    <div className="text-slate-700">
                      ชื่อบัญชี: <strong>{lang === 'th' ? CLUB_DONATION_ACCOUNT.accountNameTh : CLUB_DONATION_ACCOUNT.accountNameEn}</strong>
                    </div>
                  </div>
                </div>

                {/* 3. ข้อมูลผู้บริจาค */}
                <div className="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {lang === 'th' ? 'ชื่อ - นามสกุล ผู้บริจาค *' : 'Donor Full Name *'}
                    </label>
                    <input
                      type="text"
                      required
                      placeholder="ระบุชื่อ-นามสกุล หรือเว้นว่างหากไม่ประสงค์ออกนาม"
                      value={donorName}
                      onChange={(e) => setDonorName(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {lang === 'th' ? 'เบอร์โทรศัพท์ติดต่อ' : 'Phone Number'}
                    </label>
                    <input
                      type="tel"
                      placeholder="08x-xxx-xxxx"
                      value={donorPhone}
                      onChange={(e) => setDonorPhone(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                    />
                  </div>
                </div>

                {/* 4. ตัวเลือกขอใบเสร็จ / เอกสารลดหย่อนภาษี */}
                <div className="border border-amber-300 bg-amber-50/60 rounded-xl p-4 space-y-3">
                  <label className="flex items-center gap-2.5 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={needTaxReceipt}
                      onChange={(e) => setNeedTaxReceipt(e.target.checked)}
                      className="w-4 h-4 accent-[#091947]"
                    />
                    <span className="text-sm font-bold text-[#091947]">
                      {lang === 'th'
                        ? 'ต้องการใบรับเงินบริจาค / เอกสารประกอบการลดหย่อนภาษี (จัดส่งทางอีเมล)'
                        : 'Request Official Donation / Tax Deduction Receipt via Email'}
                    </span>
                  </label>

                  {needTaxReceipt && (
                    <div className="grid sm:grid-cols-2 gap-3 pt-2 border-t border-amber-200/80">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          เลขประจำตัวผู้เสียภาษี (13 หลัก) *
                        </label>
                        <input
                          type="text"
                          maxLength={13}
                          required={needTaxReceipt}
                          placeholder="เลขบัตรประชาชน หรือ เลขนิติบุคคล"
                          value={taxId}
                          onChange={(e) => setTaxId(e.target.value)}
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          อีเมลสำหรับรับใบเสร็จ *
                        </label>
                        <input
                          type="email"
                          required={needTaxReceipt}
                          placeholder="example@email.com"
                          value={donorEmail}
                          onChange={(e) => setDonorEmail(e.target.value)}
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white"
                        />
                      </div>
                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold text-slate-700 mb-1">
                          ที่อยู่สำหรับระบุในใบเสร็จรับเงิน
                        </label>
                        <input
                          type="text"
                          placeholder="บ้านเลขที่ ตำบล อำเภอ จังหวัด รหัสไปรษณีย์"
                          value={taxAddress}
                          onChange={(e) => setTaxAddress(e.target.value)}
                          className="w-full px-3 py-2 rounded-lg border border-slate-300 text-sm bg-white"
                        />
                      </div>
                    </div>
                  )}
                </div>

                {/* 5. แนบสลิปโอนเงิน */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    {lang === 'th' ? 'แนบหลักฐานการโอนเงิน (สลิป)' : 'Upload Transfer Slip'}
                  </label>
                  <label className="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-4 cursor-pointer hover:bg-slate-50 transition">
                    {slipPreview ? (
                      <img src={slipPreview} alt="Slip Preview" className="max-h-40 rounded-lg object-contain" />
                    ) : (
                      <div className="text-center text-xs text-slate-500">
                        <span className="text-lg block mb-1">📎</span>
                        <span>คลิกเพื่อเลือกรูปภาพสลิปโอนเงิน (JPG, PNG)</span>
                      </div>
                    )}
                    <input type="file" accept="image/*" onChange={handleFileChange} className="hidden" />
                  </label>
                </div>

                <div className="flex items-center justify-end gap-3 pt-2 border-t border-slate-200">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2.5 rounded-lg border border-slate-300 text-sm font-semibold text-slate-700 hover:bg-slate-100"
                  >
                    {lang === 'th' ? 'ยกเลิก' : 'Cancel'}
                  </button>
                  <button
                    type="submit"
                    disabled={submitting}
                    className="bg-[#091947] hover:bg-[#0F296E] text-amber-300 font-bold px-6 py-2.5 rounded-lg text-sm shadow-md transition disabled:opacity-50"
                  >
                    {submitting
                      ? lang === 'th'
                        ? 'กำลังบันทึกข้อมูล...'
                        : 'Submitting...'
                      : lang === 'th'
                      ? 'ยืนยันการแจ้งโอนเงินบริจาค'

      // ======================================================================
      function AdminDonationsManager({ donations, setDonations, notify }) {
        const [selectedSlip, setSelectedSlip] = useState(null);

        const handleApprove = async (item, index) => {
          const receiptNo =
            item.receipt_no ||
            `REC-${new Date().getFullYear()}-${String(donations.length - index).padStart(4, '0')}`;

          if (isSupabaseConfigured && supabaseClient && item.id && !String(item.id).startsWith('don-')) {
            await supabaseClient
              .from('donations')
              .update({ status: 'verified', receipt_no: receiptNo })
              .eq('id', item.id);
          }

          // ส่งอีเมลอัตโนมัติหากตั้งค่า EmailJS แล้ว
          if (
            item.need_tax_receipt &&
            item.donor_email &&
            window.emailjs &&
            EMAILJS_CONFIG.publicKey !== 'YOUR_PUBLIC_KEY'
          ) {
            try {
              await window.emailjs.send(
                EMAILJS_CONFIG.serviceId,
                EMAILJS_CONFIG.templateId,
                {
                  to_email: item.donor_email,
                  donor_name: item.donor_name,
                  project_name: item.project_name,
                  receipt_no: receiptNo,
                  receipt_date: new Date().toLocaleDateString('th-TH'),
                  tax_id: item.tax_id || '-',
                  tax_address: item.tax_address || '-',
                  amount: Number(item.amount).toLocaleString()
                },
                EMAILJS_CONFIG.publicKey
              );
              notify(`อนุมัติยอดและส่งใบเสร็จ (${receiptNo}) เข้าอีเมล ${item.donor_email} แล้ว!`);
            } catch (err) {
              console.error('EmailJS error:', err);
              notify(`อนุมัติยอดแล้ว (${receiptNo}) แต่ส่งอีเมลไม่สำเร็จ กรุณาเช็กค่า EmailJS`, 'error');
            }
          } else {
            notify(`อนุมัติยอดบริจาคและออกเลขที่ใบเสร็จ ${receiptNo} เรียบร้อยแล้ว`);
          }

          setDonations(
            donations.map((d) =>
              d.id === item.id ? { ...d, status: 'verified', receipt_no: receiptNo } : d
            )
          );
        };

        return (
          <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 className="text-lg font-bold text-[#091947]">
                  รายการแจ้งโอนเงินบริจาคและคำขอเอกสารลดหย่อนภาษี ({donations.length} รายการ)
                </h3>
                <p className="text-xs text-slate-500">
                  ตรวจสอบสลิปโอนเงินเทียบกับบัญชีสโมสร ก่อนกดปุ่มอนุมัติและออกเลขที่ใบเสร็จ
                </p>
              </div>
            </div>

            {selectedSlip && (
              <div
                onClick={() => setSelectedSlip(null)}
                className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4"
              >
                <div className="bg-white p-3 rounded-xl max-w-md w-full text-center space-y-3">
                  <img src={selectedSlip} alt="สลิปโอนเงิน" className="max-h-[70vh] mx-auto rounded-lg" />
                  <button
                    onClick={() => setSelectedSlip(null)}
                    className="px-4 py-2 bg-[#091947] text-white rounded-lg text-xs font-bold"
                  >
                    ปิดรูปภาพ
                  </button>
                </div>
              </div>
            )}

            {donations.length === 0 ? (
              <p className="text-sm text-slate-500 py-10 text-center">
                ยังไม่มีรายการบริจาคเข้ามาในระบบ
              </p>
            ) : (
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-xs sm:text-sm">
                  <thead>
                    <tr className="bg-[#091947] text-white">
                      <th className="py-3 px-3">ผู้บริจาค</th>
                      <th className="py-3 px-3">โครงการ</th>
                      <th className="py-3 px-3">ยอดเงิน</th>
                      <th className="py-3 px-3">ข้อมูลลดหย่อนภาษี</th>
                      <th className="py-3 px-3">สลิป</th>
                      <th className="py-3 px-3">สถานะ / จัดการ</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200">
                    {donations.map((d, idx) => (
                      <tr key={d.id} className="hover:bg-slate-50">
                        <td className="py-3 px-3">
                          <div className="font-bold text-slate-900">{d.donor_name}</div>
                          <div className="text-xs text-slate-500">{d.donor_phone || '-'}</div>
                        </td>
                        <td className="py-3 px-3 text-slate-700">{d.project_name}</td>
                        <td className="py-3 px-3 font-bold text-amber-700">
                          ฿{Number(d.amount).toLocaleString()}
                        </td>
                        <td className="py-3 px-3 text-xs">
                          {d.need_tax_receipt ? (
                            <div className="space-y-0.5 text-slate-700">
                              <span className="inline-block px-2 py-0.5 bg-blue-100 text-blue-900 rounded font-bold">
                                ขอใบลดหย่อนภาษี
                              </span>
                              <div>เลขผู้เสียภาษี: <strong>{d.tax_id}</strong></div>
                              <div>อีเมล: {d.donor_email}</div>
                              {d.tax_address && <div className="text-slate-500">ที่อยู่: {d.tax_address}</div>}
                            </div>
                          ) : (
                            <span className="text-slate-400">ไม่รับเอกสาร</span>
                          )}
                        </td>
                        <td className="py-3 px-3">
                          {d.slip_url ? (
                            <button
                              onClick={() => setSelectedSlip(d.slip_url)}
                              className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 rounded text-xs font-semibold text-blue-900"
                            >
                              🖼️ ดูสลิป
                            </button>
                          ) : (
                            <span className="text-xs text-slate-400">ไม่มีรูป</span>
                          )}
                        </td>
                        <td className="py-3 px-3">
                          {d.status === 'verified' ? (
                            <div className="space-y-1">
                              <span className="inline-block px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-bold">
                                ✓ อนุมัติแล้ว ({d.receipt_no})
                              </span>
                            </div>
                          ) : (
                            <button
                              onClick={() => handleApprove(d, idx)}
                              className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow"
                            >
                              ✓ อนุมัติยอดเงิน
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        );
      }

                <input
                  type="url"
                  placeholder="ลิงก์รูปภาพกิจกรรม (URL)"
                  value={form.cover_image}
                  onChange={(e) => setForm({ ...form, cover_image: e.target.value })}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
              </div>
              <button
                type="submit"
                className="bg-[#091947] hover:bg-[#0F296E] text-amber-300 font-bold px-5 py-2.5 rounded-lg text-sm"
              >
                + บันทึกกิจกรรม
              </button>
            </form>

            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-3">
              <h4 className="font-bold text-[#091947]">รายการกิจกรรมทั้งหมด ({activities.length})</h4>
              {activities.map((a) => (
                <div
                  key={a.id}
                  className="p-4 rounded-xl border border-slate-200 flex items-center justify-between gap-4"
                >
                  <div>
                    <div className="font-bold text-slate-900 text-sm">{a.title_th}</div>
                    <div className="text-xs text-slate-500">
                      {a.event_date} • {a.location_th}
                    </div>
                  </div>
                  <button
                    onClick={async () => {
                      if (isSupabaseConfigured && supabaseClient) {
                        await supabaseClient.from('activities').delete().eq('id', a.id);
                      }
                      setActivities(activities.filter((x) => x.id !== a.id));
                      notify('ลบกิจกรรมเรียบร้อยแล้ว');
                    }}
                    className="px-3 py-1.5 text-red-600 hover:bg-red-50 rounded-lg text-xs font-bold"
                  >
                    ลบ
                  </button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AdminGalleryManager({ gallery, setGallery, canEdit, notify }) {
        const [titleTh, setTitleTh] = useState('');
        const [albumName, setAlbumName] = useState('กิจกรรมเพื่อสังคม');
        const [imageUrl, setImageUrl] = useState('');
        const [uploading, setUploading] = useState(false);

        if (!canEdit) {
          return (
            <div className="bg-amber-50 border border-amber-200 p-6 rounded-xl text-sm text-amber-900">
              บัญชีของคุณไม่มีสิทธิ์ในการอัปโหลดรูปภาพ
            </div>
          );
        }

        const handleFileUpload = async (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setUploading(true);

          if (isSupabaseConfigured && supabaseClient) {
            const fileName = `${Date.now()}-${file.name}`;
            const { error } = await supabaseClient.storage.from('lions-media').upload(fileName, file);
            if (!error) {
              const { data } = supabaseClient.storage.from('lions-media').getPublicUrl(fileName);
              setImageUrl(data.publicUrl);
              notify('อัปโหลดไฟล์ไปยัง Supabase Storage สำเร็จ');
              setUploading(false);
              return;
            }
          }

          const reader = new FileReader();
          reader.onload = () => {
            setImageUrl(reader.result);
            notify('เลือกรูปภาพเรียบร้อยแล้ว');
            setUploading(false);
          };
          reader.readAsDataURL(file);
        };

        const handleAddImage = async (e) => {
          e.preventDefault();
          if (!imageUrl) return;
          const payload = {
            title_th: titleTh,
            title_en: titleTh,
            album_name: albumName,
            image_url: imageUrl,
            taken_date: new Date().toISOString().split('T')[0]
          };
          const newImg = { id: `gal-${Date.now()}`, ...payload };
          if (isSupabaseConfigured && supabaseClient) {
            const { data } = await supabaseClient.from('gallery_items').insert([payload]).select();
            if (data && data[0]) newImg.id = data[0].id;
          }
          setGallery([newImg, ...gallery]);
          setTitleTh('');
          setImageUrl('');
          notify('เพิ่มรูปภาพเข้าคลังภาพกิจกรรมแล้ว');
        };

        return (
          <div className="space-y-6">
            <form
              onSubmit={handleAddImage}
              className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4"
            >
              <h3 className="font-bold text-[#091947] text-lg">อัปโหลดรูปภาพเข้าคลังภาพกิจกรรม</h3>
              <div className="grid sm:grid-cols-2 gap-4">
                <input
                  type="text"
                  required
                  placeholder="คำบรรยายภาพกิจกรรม *"
                  value={titleTh}
                  onChange={(e) => setTitleTh(e.target.value)}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
                <input
                  type="text"
                  placeholder="ชื่ออัลบั้ม (เช่น กิจกรรมสายตา, โครงการเยาวชน)"
                  value={albumName}
                  onChange={(e) => setAlbumName(e.target.value)}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
              </div>

              <div className="grid sm:grid-cols-2 gap-4 items-center">
                <label className="flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg p-3 cursor-pointer hover:bg-slate-50 text-sm font-medium text-slate-700">
                  <span>{uploading ? 'กำลังอัปโหลด...' : '📁 เลือกไฟล์รูปภาพจากเครื่อง'}</span>
                  <input type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                </label>
                <input
                  type="text"
                  placeholder="หรือวางลิงก์รูปภาพ (Image URL)"
                  value={imageUrl}
                  onChange={(e) => setImageUrl(e.target.value)}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
              </div>

              <button
                type="submit"
                className="bg-[#091947] hover:bg-[#0F296E] text-amber-300 font-bold px-5 py-2.5 rounded-lg text-sm"
              >
                + บันทึกรูปภาพลงคลังภาพ
              </button>
            </form>

            <div className="grid sm:grid-cols-3 lg:grid-cols-4 gap-4">
              {gallery.map((g) => (
                <div key={g.id} className="bg-white rounded-xl overflow-hidden border border-slate-200">
                  <img src={g.image_url} alt={g.title_th} className="w-full h-36 object-cover" />
                  <div className="p-3 flex items-center justify-between gap-2">
                    <div className="text-xs font-semibold truncate">{g.title_th}</div>
                    <button
                      onClick={async () => {
                        if (isSupabaseConfigured && supabaseClient) {
                          await supabaseClient.from('gallery_items').delete().eq('id', g.id);
                        }
                        setGallery(gallery.filter((x) => x.id !== g.id));
                        notify('ลบรูปภาพเรียบร้อยแล้ว');
                      }}
                      className="text-red-600 px-2 py-1 hover:bg-red-50 rounded text-xs font-bold"
                    >
                      ลบ
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AdminMembersManager({ members, setMembers, canEdit, notify }) {
        const [form, setForm] = useState({
          name_th: '',
          name_en: '',
          role_th: '',
          role_en: '',
          member_type: 'board',
          lion_year: '2026–2027',
          display_order: 1
        });

        if (!canEdit) {
          return (
            <div className="bg-amber-50 border border-amber-200 p-6 rounded-xl text-sm text-amber-900">
              เฉพาะผู้ดูแลระบบสูงสุด (Super Admin) เท่านั้นที่สามารถแก้ไขรายชื่อคณะกรรมการและสมาชิก
            </div>
          );
        }

        const handleAdd = async (e) => {
          e.preventDefault();
          const payload = {
            ...form,
            name_en: form.name_en || form.name_th,
            role_en: form.role_en || form.role_th,
            display_order: Number(form.display_order) || 99
          };
          const newMem = { id: `mem-${Date.now()}`, ...payload, photo_url: '' };
          if (isSupabaseConfigured && supabaseClient) {
            const { data } = await supabaseClient.from('club_members').insert([payload]).select();
            if (data && data[0]) newMem.id = data[0].id;
          }
          setMembers([...members, newMem]);
          notify('เพิ่มรายชื่อกรรมการ/สมาชิกเรียบร้อยแล้ว');
          setForm({
            name_th: '',
            name_en: '',
            role_th: '',
            role_en: '',
            member_type: 'board',
            lion_year: '2026–2027',
            display_order: 1
          });
        };

        return (
          <div className="space-y-6">
            <form
              onSubmit={handleAdd}
              className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4"
            >
              <h3 className="font-bold text-[#091947] text-lg">เพิ่มคณะกรรมการบริหารและสมาชิกสโมสร</h3>
              <div className="grid sm:grid-cols-2 gap-4">
                <input
                  type="text"
                  required
                  placeholder="ชื่อ - นามสกุล (ภาษาไทย เช่น ไลออน สมชาย ใจดี) *"
                  value={form.name_th}
                  onChange={(e) => setForm({ ...form, name_th: e.target.value })}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
                <input
                  type="text"
                  placeholder="Full Name (English)"
                  value={form.name_en}
                  onChange={(e) => setForm({ ...form, name_en: e.target.value })}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
              </div>
              <div className="grid sm:grid-cols-3 gap-4">
                <input
                  type="text"
                  required
                  placeholder="ตำแหน่ง (เช่น นายกสโมสร, สมาชิกสามัญ) *"
                  value={form.role_th}
                  onChange={(e) => setForm({ ...form, role_th: e.target.value })}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
                <select
                  value={form.member_type}
                  onChange={(e) => setForm({ ...form, member_type: e.target.value })}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                >
                  <option value="board">คณะกรรมการบริหาร (Board)</option>
                  <option value="member">สมาชิกสโมสร (General Member)</option>
                </select>
                <input
                  type="text"
                  placeholder="ปีบริหาร (เช่น 2026–2027)"
                  value={form.lion_year}
                  onChange={(e) => setForm({ ...form, lion_year: e.target.value })}
                  className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                />
              </div>
              <button
                type="submit"
                className="bg-[#091947] hover:bg-[#0F296E] text-amber-300 font-bold px-5 py-2.5 rounded-lg text-sm"
              >
                + เพิ่มรายชื่อ
              </button>
            </form>

            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-2">
              {members.map((m) => (
                <div
                  key={m.id}
                  className="p-3.5 rounded-xl border border-slate-200 flex items-center justify-between"
                >
                  <div>
                    <div className="font-bold text-sm text-slate-900">{m.name_th}</div>
                    <div className="text-xs text-slate-500">
                      {m.role_th} • {m.member_type === 'board' ? 'คณะกรรมการ' : 'สมาชิก'}
                    </div>
                  </div>
                  <button
                    onClick={async () => {
                      if (isSupabaseConfigured && supabaseClient) {
                        await supabaseClient.from('club_members').delete().eq('id', m.id);
                      }
                      setMembers(members.filter((x) => x.id !== m.id));
                      notify('ลบรายชื่อเรียบร้อยแล้ว');
                    }}
                    className="px-3 py-1 text-red-600 hover:bg-red-50 rounded-lg text-xs font-bold"
                  >
                    ลบ
                  </button>
                </div>
              ))}
            </div>
          </div>
        );
      }

      function AdminUsersManager({ admins, setAdmins, isSuperAdmin, notify }) {
        const [form, setForm] = useState({
          email: '',
          full_name_th: '',
          position_th: '',
          role: 'editor'
        });

        const handleAddAdmin = async (e) => {
          e.preventDefault();
          if (!isSuperAdmin) return;
          const payload = {
            ...form,
            full_name_en: form.full_name_th,
            position_en: form.position_th,
            is_active: true
          };
          const newAdmin = { id: `adm-${Date.now()}`, ...payload };
          if (isSupabaseConfigured && supabaseClient) {
            await supabaseClient.from('admin_users').insert([payload]);
          }
          setAdmins([...admins, newAdmin]);
          notify('เพิ่มบัญชีผู้ดูแลระบบเรียบร้อยแล้ว');
          setForm({ email: '', full_name_th: '', position_th: '', role: 'editor' });
        };

        return (
          <div className="space-y-6">
            <div className="bg-blue-50 border border-blue-200 p-5 rounded-xl text-sm text-slate-800">
              <strong>ระบบจัดการผู้ดูแลหลายคนและกำหนดสิทธิ์ (RBAC):</strong> รองรับการเพิ่มผู้ดูแลระบบได้ไม่จำกัด (10 คนขึ้นไป) โดยแบ่งสิทธิ์ออกเป็น 3 ระดับ:
              <ul className="mt-2 space-y-1 text-xs">
                <li>• <strong>Super Admin:</strong> จัดการได้ทุกส่วน รวมถึงเพิ่ม/ลบผู้ดูแลระบบและจัดการสมาชิก</li>
                <li>• <strong>Editor (ฝ่ายประชาสัมพันธ์):</strong> เพิ่ม/แก้ไข/ลบ ข่าวประชาสัมพันธ์และกิจกรรม</li>
                <li>• <strong>Media Manager (ฝ่ายโสตฯ):</strong> อัปโหลดและจัดการคลังภาพกิจกรรม</li>
              </ul>
            </div>

            {isSuperAdmin && (
              <form
                onSubmit={handleAddAdmin}
                className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4"
              >
                <h3 className="font-bold text-[#091947] text-lg">เพิ่มผู้ดูแลระบบใหม่</h3>
                <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <input
                    type="text"
                    required
                    placeholder="ชื่อ - นามสกุล ผู้ดูแล *"
                    value={form.full_name_th}
                    onChange={(e) => setForm({ ...form, full_name_th: e.target.value })}
                    className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                  />
                  <input
                    type="email"
                    required
                    placeholder="อีเมลสำหรับเข้าสู่ระบบ *"
                    value={form.email}
                    onChange={(e) => setForm({ ...form, email: e.target.value })}
                    className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                  />
                  <input
                    type="text"
                    required
                    placeholder="ตำแหน่งในสโมสร *"
                    value={form.position_th}
                    onChange={(e) => setForm({ ...form, position_th: e.target.value })}
                    className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                  />
                  <select
                    value={form.role}
                    onChange={(e) => setForm({ ...form, role: e.target.value })}
                    className="px-3.5 py-2.5 rounded-lg border border-slate-300 text-sm"
                  >
                    <option value="super_admin">Super Admin (สิทธิ์เต็ม)</option>
                    <option value="editor">Editor (ข่าวและกิจกรรม)</option>
                    <option value="media_manager">Media Manager (คลังภาพ)</option>
                  </select>
                </div>
                <button
                  type="submit"
                  className="bg-[#091947] hover:bg-[#0F296E] text-amber-300 font-bold px-5 py-2.5 rounded-lg text-sm"
                >
                  + เพิ่มผู้ดูแลระบบ
                </button>
              </form>
            )}

            <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm overflow-x-auto">
              <table className="w-full text-left border-collapse text-sm">
                <thead>
                  <tr className="bg-[#091947] text-white">
                    <th className="py-3 px-4">ลำดับ</th>
                    <th className="py-3 px-4">ชื่อผู้ดูแลระบบ</th>
                    <th className="py-3 px-4">อีเมล</th>
                    <th className="py-3 px-4">ตำแหน่ง</th>
                    <th className="py-3 px-4">ระดับสิทธิ์ (Role)</th>
                    <th className="py-3 px-4">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200">
                  {admins.map((adm, idx) => (
                    <tr key={adm.id}>
                      <td className="py-3 px-4">{idx + 1}</td>
                      <td className="py-3 px-4 font-semibold">{adm.full_name_th}</td>
                      <td className="py-3 px-4 text-slate-600">{adm.email}</td>
                      <td className="py-3 px-4">{adm.position_th}</td>
                      <td className="py-3 px-4">
                        {isSuperAdmin ? (
                          <select
                            value={adm.role}
                            onChange={(e) => {
                              const updated = admins.map((a) =>
                                a.id === adm.id ? { ...a, role: e.target.value } : a
                              );
                              setAdmins(updated);
                              notify('อัปเดตสิทธิ์ผู้ดูแลระบบแล้ว');
                            }}
                            className="px-2.5 py-1 rounded border border-slate-300 text-xs font-semibold"
                          >
                            <option value="super_admin">super_admin</option>
                            <option value="editor">editor</option>
                            <option value="media_manager">media_manager</option>
                          </select>
                        ) : (
                          <span className="px-2.5 py-1 rounded bg-slate-100 text-xs font-bold">
                            {adm.role}
                          </span>
                        )}
                      </td>
                      <td className="py-3 px-4">
                        {isSuperAdmin && idx > 0 && (
                          <button
                            onClick={() => {
                              setAdmins(admins.filter((a) => a.id !== adm.id));
                              notify('ลบบัญชีผู้ดูแลระบบแล้ว');
                            }}
                            className="text-red-600 hover:bg-red-50 px-2 py-1 rounded text-xs font-bold"
                          >
                            ลบ
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
